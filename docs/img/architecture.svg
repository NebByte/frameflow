<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470"
     font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .box   { fill: #6e768133; stroke: #6e7681; stroke-width: 1.4; }
    .sup   { fill: #388bfd26; stroke: #58a6ff; stroke-width: 1.8; }
    .scout { fill: #d2992226; stroke: #d29922; stroke-width: 1.6; }
    .conv  { fill: #3fb95026; stroke: #3fb950; stroke-width: 1.6; }
    .arc   { fill: #a371f726; stroke: #a371f7; stroke-width: 1.6; }
    .t     { fill: #adbac7; font-size: 12.5px; }
    .h     { fill: #e6edf3; font-size: 14px; font-weight: 600; }
    .s     { fill: #768390; font-size: 11px; }
    .arrow { stroke: #768390; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#768390"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="204" width="112" height="52" rx="8"/>
  <text class="h" x="72" y="228" text-anchor="middle">a film</text>
  <text class="s" x="72" y="245" text-anchor="middle">+ a question</text>

  <rect class="box sup" x="168" y="188" width="176" height="84" rx="8"/>
  <text class="h" x="256" y="214" text-anchor="middle">supervisor</text>
  <text class="t" x="256" y="234" text-anchor="middle">Gemini · ADK · Cloud Run</text>
  <text class="s" x="256" y="254" text-anchor="middle">routes, never does the work</text>
  <path class="arrow" d="M132,230 L164,230"/>

  <!-- scout -->
  <rect class="box scout" x="396" y="24" width="230" height="92" rx="8"/>
  <text class="h" x="412" y="48">scout</text>
  <text class="t" x="412" y="68">triage_film · list_films</text>
  <text class="s" x="412" y="87">verdict per shot without rendering</text>
  <text class="s" x="412" y="104">cannot render — that is the point</text>

  <!-- conversion -->
  <rect class="box conv" x="396" y="140" width="230" height="110" rx="8"/>
  <text class="h" x="412" y="164">conversion</text>
  <text class="t" x="412" y="184">render_film · settle_walls</text>
  <text class="t" x="412" y="202">inspect_walls · render_status</text>
  <text class="s" x="412" y="221">recovers walls from the footage</text>
  <text class="s" x="412" y="238">settling invents nothing</text>

  <!-- archivist -->
  <rect class="box arc" x="396" y="274" width="230" height="92" rx="8"/>
  <text class="h" x="412" y="298">archivist</text>
  <text class="t" x="412" y="318">record_run · ledger.* (MCP)</text>
  <text class="s" x="412" y="337">every verdict, refusals included</text>
  <text class="s" x="412" y="354">touches no pixels</text>

  <path class="arrow" d="M348,214 C374,214 374,70 392,70"/>
  <path class="arrow" d="M348,230 L392,192"/>
  <path class="arrow" d="M348,246 C374,246 374,320 392,320"/>

  <!-- outputs -->
  <rect class="box" x="686" y="40" width="238" height="96" rx="8"/>
  <text class="h" x="805" y="64" text-anchor="middle">three projector feeds</text>
  <text class="s" x="805" y="85" text-anchor="middle">left · centre · right</text>
  <text class="s" x="805" y="103" text-anchor="middle">+ per-pixel provenance</text>
  <text class="s" x="805" y="121" text-anchor="middle">photographed vs invented</text>
  <path class="arrow" d="M630,182 C660,182 660,110 682,110"/>

  <rect class="box arc" x="686" y="272" width="238" height="96" rx="8"/>
  <text class="h" x="805" y="296" text-anchor="middle">ClickHouse</text>
  <text class="t" x="805" y="316" text-anchor="middle">frameflow_shots</text>
  <text class="s" x="805" y="335" text-anchor="middle">one row per shot</text>
  <text class="s" x="805" y="353" text-anchor="middle">read via mcp-clickhouse</text>
  <path class="arrow" d="M630,320 L682,320"/>

  <text class="s" x="470" y="404" text-anchor="middle">“across the catalogue, what converts without inventing anything?”</text>
  <text class="s" x="470" y="436" text-anchor="middle">every tool is a thin wrapper over code that is already tested — 642 checks</text>
</svg>
